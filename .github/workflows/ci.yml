name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Initialize data from GitHub in a fresh directory
        run: npm run data:init
        env:
          DUEL_COMPASS_DATA_DIR: ${{ runner.temp }}/duel-compass-install-data
      - name: Verify real card data and MCP integration
        run: npm run test:integration
        env:
          DUEL_COMPASS_DATA_DIR: ${{ runner.temp }}/duel-compass-install-data
      - run: npm pack --dry-run
