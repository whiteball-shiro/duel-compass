name: release
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    if: github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'Publish release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Resolve release version
        id: version
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); const tag = 'v' + p.version; if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== tag) throw new Error('Tag does not match package version'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + '\n');"
      - run: mkdir -p dist && npm pack --pack-destination ./dist
      - run: cd dist && sha256sum *.tgz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          body_path: docs/releases/${{ steps.version.outputs.tag }}.md
          files: dist/*
